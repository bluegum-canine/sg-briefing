document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const msg=document.getElementById("msg"),btn=document.getElementById("go");
  const pw=document.getElementById("pw").value.trim().toLowerCase().replace(/\s+/g,"-");
  if(!pw){msg.textContent="Type the password first.";return}
  msg.style.color="#444";msg.textContent="Opening\u2026";btn.disabled=true;
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);

    document.open();document.write(out.slice(11));document.close();
