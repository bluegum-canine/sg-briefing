  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(SALT),iterations:IT},base,384));
    const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
    const out=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32)},key,b64(CT)));
    if(!out.startsWith("BLUEGUM-OK\n"))throw new Error("bad");
    document.open();document.write(out.slice(11));document.close();
  }catch(err){msg.style.color="#a11";msg.textContent="That password did not work. Check the spelling and the dashes, then try again.";btn.disabled=false}
});
</script>
